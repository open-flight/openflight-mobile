version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo and React Native constraints are maintained together with
    # `npx expo install`; Dependabot may only refresh versions already allowed
    # by those reviewed manifest constraints.
    versioning-strategy: lockfile-only
    commit-message:
      prefix: build(deps)
    groups:
      npm-lockfile:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns:
          - '*'
